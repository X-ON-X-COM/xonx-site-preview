name: deploy

# Every push to main (including each "Publish" from /admin/) rebuilds the site
# with Astro and hands dist/ to GitHub Pages. The home page in public/ is copied
# unchanged; Astro adds /cases/, /insights/ and sitemap.xml around it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the "built" branch below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
      # The marketing bot's site-watch compares the live home page with a copy it
      # can fetch from GitHub. The live page is public/index.html with the cases
      # put in at build time, so the copy is the built file, kept on the orphan
      # branch "built" (one commit, replaced on every deploy).
      - name: Keep the built home page on the "built" branch
        run: |
          mkdir -p "$RUNNER_TEMP/built" && cp dist/index.html dist/m.html "$RUNNER_TEMP/built/"
          cd "$RUNNER_TEMP/built"
          git init -q -b built
          git add index.html m.html
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "Built home page of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" built
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
